<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription | SondArt</title>
  <link rel="icon" type="image/svg+xml" href="../frontend/logo.svg" />
  <link rel="stylesheet" href="../frontend/design-system.css" />
  <link rel="stylesheet" href="login.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <header class="site-header-minimal">
    <a class="brand-link-minimal" href="../">
      <svg class="brand-mark-minimal" viewBox="0 0 48 48" width="40" height="40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="135%" y2="135%">
            <stop offset="0%" style="stop-color:#2f6fed;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4d90ff;stop-opacity:1" />
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="22" fill="url(#logoGrad)" />
        <circle cx="24" cy="14" r="6" fill="#ffffff" />
        <path d="M20 20c0 2.2 1.8 4 4 4s4-1.8 4-4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M24 24v6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <circle cx="24" cy="14" r="9" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
        <circle cx="24" cy="14" r="13" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />
      </svg>
      <span class="brand-title-minimal">SondArt</span>
    </a>
  </header>

  <main class="page-shell auth-shell" aria-labelledby="register-title">
    <header class="auth-header">
      <h1 id="register-title" class="page-title">Inscription</h1>
      <p class="page-intro">Crée ton compte pour commencer à publier des sondages ciblés.</p>
    </header>

    <form id="register-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="name-register">Nom complet</label>
        <input
          type="text"
          id="name-register"
          name="name"
          autocomplete="name"
          required
          placeholder="Ton nom complet"
        />
        <p class="field-error" id="name-register-error" aria-live="polite"></p>
      </div>

      <div class="form-group">
        <label for="email-register">Adresse email</label>
        <input
          type="email"
          id="email-register"
          name="email"
          autocomplete="email"
          required
          placeholder="email@example.com"
        />
        <p class="field-error" id="email-register-error" aria-live="polite"></p>
      </div>

      <div class="form-group">
        <label for="password-register">Mot de passe</label>
        <div class="password-field">
          <input
            type="password"
            id="password-register"
            name="password"
            autocomplete="new-password"
            required
            placeholder="••••••••"
          />
          <button
            type="button"
            id="toggle-password-register"
            class="icon-button"
            aria-pressed="false"
            aria-label="Afficher le mot de passe"
          >
            <i data-lucide="eye" aria-hidden="true"></i>
          </button>
        </div>
        <div id="password-strength" class="password-strength" aria-live="polite"></div>
        <p class="field-error" id="password-register-error" aria-live="polite"></p>
      </div>

      <div class="form-group">
        <label for="confirm-password-register">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirm-password-register"
          name="confirmPassword"
          autocomplete="new-password"
          required
          placeholder="Confirmer le mot de passe"
        />
        <p class="field-error" id="confirm-password-register-error" aria-live="polite"></p>
      </div>

      <label class="inline-control" for="accept-privacy">
        <input type="checkbox" id="accept-privacy" name="acceptPrivacy" />
        En continuant, j'accepte la <a href="https://example.com/privacy" target="_blank" rel="noopener noreferrer">politique de confidentialité</a>.
      </label>
      <p class="field-error" id="accept-privacy-error" aria-live="polite"></p>

      <div id="register-status" class="form-status visually-hidden" role="status" aria-live="polite"></div>
      <button type="submit" id="register-submit">S'inscrire</button>
    </form>

    <div class="divider" aria-hidden="true"><span>ou</span></div>

    <div class="auth-actions">
      <button type="button" id="google-register" class="secondary-button">Inscription Google</button>
      <p class="auth-note">Déjà un compte ? <a href="login.html">Se connecter</a></p>
    </div>
  </main>

  <script type="module" src="connexion.js"></script>
  <script>lucide.createIcons();</script>
</body>

</html>
