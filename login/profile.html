<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complétez votre profil | SondArt</title>
  <link rel="icon" type="image/svg+xml" href="../frontend/logo.svg" />
  <link rel="stylesheet" href="../frontend/design-system.css" />
  <link rel="stylesheet" href="login.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .onboarding-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
    }

    .onboarding-steps {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--color-muted);
    }

    .step.active {
      color: var(--color-primary);
      font-weight: 600;
    }

    .step-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(47, 111, 237, 0.1);
      border: 1px solid var(--color-border);
      font-size: 0.85rem;
    }

    .step.active .step-number {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
    }

    .success-message {
      padding: 1rem;
      background: rgba(47, 143, 95, 0.1);
      border-left: 4px solid var(--color-success);
      border-radius: 4px;
      color: var(--color-success);
      margin-bottom: 1.5rem;
      display: none;
    }

    .success-message.visible {
      display: block;
    }
  </style>
</head>

<body>
  <header class="site-header-minimal">
    <a class="brand-link-minimal" href="../">
      <svg class="brand-mark-minimal" viewBox="0 0 48 48" width="40" height="40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="135%" y2="135%">
            <stop offset="0%" style="stop-color:#2f6fed;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4d90ff;stop-opacity:1" />
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="22" fill="url(#logoGrad)" />
        <circle cx="24" cy="14" r="6" fill="#ffffff" />
        <path d="M20 20c0 2.2 1.8 4 4 4s4-1.8 4-4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M24 24v6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <circle cx="24" cy="14" r="9" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
        <circle cx="24" cy="14" r="13" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />
      </svg>
      <span class="brand-title-minimal">SondArt</span>
    </a>
  </header>

  <main class="page-shell auth-shell onboarding-container">
    <div class="onboarding-steps">
      <div class="step active">
        <div class="step-number">1</div>
        <span>Profil</span>
      </div>
      <div class="step">
        <div class="step-number">2</div>
        <span>Créer sondage</span>
      </div>
      <div class="step">
        <div class="step-number">3</div>
        <span>Partager</span>
      </div>
    </div>

    <header class="auth-header">
      <h1 id="profile-title" class="page-title">Complétez votre profil</h1>
      <p class="page-intro">Nous avons besoin de quelques informations pour personnaliser votre expérience.</p>
    </header>

    <div class="success-message" id="success-message">
      <i data-lucide="circle-check" aria-hidden="true"></i> Profil mis à jour avec succès !
    </div>

    <form id="profile-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          placeholder="votre_nom_utilisateur"
          minlength="3"
          maxlength="30"
        />
        <p class="field-error" id="username-error" aria-live="polite"></p>
      </div>

      <div class="form-group">
        <label for="organization">Organisation (optionnel)</label>
        <input
          type="text"
          id="organization"
          name="organization"
          placeholder="Nom de votre entreprise/organisation"
          maxlength="100"
        />
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" id="accept-newsletter" name="newsletter" />
          <span style="margin-left: 0.5rem;">Recevoir les actualités et mises à jour de SondArt</span>
        </label>
      </div>

      <button type="submit" id="profile-submit" class="btn btn-primary" style="width: 100%;">
        Continuer
      </button>
      <p id="profile-status" class="form-status visually-hidden" aria-live="polite"></p>
    </form>

    <div style="text-align: center; margin-top: 2rem;">
      <a href="../frontend/dashboard.html" class="nav-link" style="display: inline-block;">
        Passer cette étape <i data-lucide="arrow-right" aria-hidden="true"></i>
      </a>
    </div>
  </main>

  <script type="module" src="profile.js"></script>
  <script>lucide.createIcons();</script>
</body>

</html>
